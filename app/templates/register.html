<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <title>Registreren – EventSnap</title>
  <link rel="stylesheet" href="/static/style.css?v=15">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-top">
        <h1 class="brand-title">EventSnap</h1>
      </div>
      <p>Genereer een LinkedIn post voor een event dat je gaat bijwonen.</p>
    </div>
  </header>

  <main>
    <div class="card">
      <h2 style="margin-bottom:1.25rem">Account aanmaken</h2>

      {% if error %}
      <div class="toast toast-error" style="position:static;margin-bottom:1rem">{{ error }}</div>
      {% endif %}

      <form method="post" action="/register" style="display:flex;flex-direction:column;gap:0.875rem">
        {{ csrf_field(request) | safe }}
        <div>
          <label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.3rem">E-mailadres</label>
          <input type="email" name="email" required autocomplete="email"
                 style="width:100%;padding:0.6rem 0.75rem;border:1.5px solid #d4d4d8;border-radius:8px;font-size:0.95rem">
        </div>
        <div>
          <label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.3rem">Wachtwoord <span style="font-weight:400;color:#71717a">(min. 8 tekens)</span></label>
          <div class="pw-wrap">
            <input type="password" id="pw-reg1" name="password" required autocomplete="new-password"
                   style="width:100%;padding:0.6rem 0.75rem;border:1.5px solid #d4d4d8;border-radius:8px;font-size:0.95rem">
            <button type="button" class="pw-toggle" onclick="togglePw('pw-reg1', this)" aria-label="Toon wachtwoord">👁</button>
          </div>
        </div>
        <div>
          <label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.3rem">Wachtwoord herhalen</label>
          <div class="pw-wrap">
            <input type="password" id="pw-reg2" name="password2" required autocomplete="new-password"
                   style="width:100%;padding:0.6rem 0.75rem;border:1.5px solid #d4d4d8;border-radius:8px;font-size:0.95rem">
            <button type="button" class="pw-toggle" onclick="togglePw('pw-reg2', this)" aria-label="Toon wachtwoord">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:0.25rem">Account aanmaken</button>
      </form>

      <p style="margin-top:1.25rem;font-size:0.85rem;text-align:center;color:#71717a">
        Al een account? <a href="/login" style="color:#0a66c2;font-weight:600">Inloggen</a>
      </p>
    </div>
  </main>
  <script>
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.style.opacity = input.type === 'text' ? '1' : '0.5';
    }
    document.querySelectorAll('.pw-toggle').forEach(btn => { btn.style.opacity = '0.5'; });
  </script>
</body>
</html>
