<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <title>{{ t.forgot_title }}</title>
  <link rel="stylesheet" href="/static/style.css?v=19">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-top">
        <h1 class="brand-title">EventSnap</h1>
        <form method="post" action="/language" style="margin:0">
          {{ csrf_field(request) | safe }}
          <input type="hidden" name="lang" value="{{ 'en' if lang == 'nl' else 'nl' }}">
          <button type="submit" class="lang-toggle">{{ t.lang_toggle }}</button>
        </form>
      </div>
      <p>{{ t.tagline }}</p>
    </div>
  </header>

  <main>
    <div class="card">
      <h2 style="margin-bottom:1.25rem">{{ t.forgot_heading }}</h2>

      {% if sent %}
      <div class="toast" style="position:static;margin-bottom:1rem">{{ t.forgot_sent }}</div>
      <p style="font-size:0.85rem;text-align:center;color:#71717a;margin-top:1rem">
        <a href="/login" style="color:#0a66c2;font-weight:600">{{ t.forgot_back }}</a>
      </p>
      {% else %}
      <p style="font-size:0.875rem;color:#52525b;margin-bottom:1.25rem">{{ t.forgot_description }}</p>
      <form method="post" action="/forgot-password" style="display:flex;flex-direction:column;gap:0.875rem">
        {{ csrf_field(request) | safe }}
        <div>
          <label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.3rem">{{ t.email_label }}</label>
          <input type="email" name="email" required autocomplete="email"
                 style="width:100%;padding:0.6rem 0.75rem;border:1.5px solid #d4d4d8;border-radius:8px;font-size:0.95rem">
        </div>
        <button type="submit" class="btn-primary" style="margin-top:0.25rem">{{ t.forgot_btn }}</button>
      </form>
      <p style="margin-top:1.25rem;font-size:0.85rem;text-align:center;color:#71717a">
        <a href="/login" style="color:#0a66c2;font-weight:600">{{ t.forgot_back }}</a>
      </p>
      {% endif %}
    </div>
  </main>
</body>
</html>
