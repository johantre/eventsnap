<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <title>{{ t.error_title }}</title>
  <link rel="stylesheet" href="/static/style.css?v=19">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div>
          <a href="/" class="back">{{ t.nav_back }}</a>
          <h1>{{ t.error_heading }}</h1>
        </div>
        <div class="nav-wrap">
          <button class="hamburger" id="hamburger" aria-label="Menu" onclick="toggleMenu()">
            <span></span><span></span><span></span>
          </button>
          <nav class="nav-menu" id="nav-menu">
            <a href="/prompts">{{ t.nav_styles }}</a>
            <a href="/settings">{{ t.nav_settings }}</a>
            <a href="/account">{{ t.nav_account }}</a>
            {% if current_user and current_user.is_admin %}<a href="/admin/users">{{ t.nav_admin }}</a>{% endif %}
          </nav>
        </div>
      </div>
    </div>
  </header>
  <main>
    <section class="card">
      <h2 class="section-heading" style="color:#ef4444; border-color:#ef4444">Fout {{ status }}</h2>
      <p style="margin-top:1rem; font-size:0.9rem; color:#52525b; line-height:1.6">{{ message }}</p>
      <div style="margin-top:1.5rem; display:flex; gap:0.75rem">
        <a href="/" class="btn-primary" style="text-decoration:none">{{ t.error_back_home }}</a>
        <a href="/settings" class="btn-copy" style="text-decoration:none">{{ t.error_check_settings }}</a>
      </div>
    </section>
  </main>
  <script>
    function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }
    document.addEventListener('click', e => { if (!document.getElementById('hamburger').contains(e.target)) document.getElementById('nav-menu').classList.remove('open'); });
  </script>
</body>
</html>
